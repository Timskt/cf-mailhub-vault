name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm typecheck:sdk
      - run: pnpm docs:check
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm test:sdk:python
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            output/e2e-results
            output/e2e-report
          retention-days: 7
      - run: pnpm build:connector
      - run: docker compose -p mailhub-storage-test -f compose.storage-test.yml up -d --wait
      - run: pnpm test:storage
      - if: always()
        run: docker compose -p mailhub-storage-test -f compose.storage-test.yml down
      - run: pnpm audit --prod --registry=https://registry.npmjs.org
